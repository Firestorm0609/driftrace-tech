<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DRIFT — AI Race Hub</title><meta name="theme-color" content="#030402"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030402;color:#c8df72;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}button,input,select{font:inherit;color:inherit;background:#030402;border:1px solid #71833d}button{cursor:pointer}button:hover{background:#c8df72;color:#030402}.top{height:34px;border-bottom:1px solid #71833d;display:flex;align-items:center;padding:0 12px;gap:12px}.brand{font-weight:900;letter-spacing:.22em}.muted{opacity:.55;font-size:10px}.wallet{margin-left:auto;padding:4px 9px;font-size:10px}.world{height:calc(100vh - 34px);display:grid;grid-template-columns:minmax(230px,25vw) 1fr;gap:10px;padding:10px}.hub{display:flex;align-items:flex-start;justify-content:flex-start}.hubbox{width:100%;max-width:310px;border:1px solid #71833d;padding:8px}.hubtitle{border:1px solid #71833d;padding:7px;text-align:center;font-size:20px;font-weight:900;letter-spacing:.12em}.room{border:1px solid #71833d;margin-top:8px;padding:8px;height:150px;position:relative}.agentmsg{height:32px;border-bottom:1px dashed #4f5c2b;padding-bottom:5px;font-size:9px;overflow:hidden}.desk{height:100px;display:flex;align-items:center;justify-content:center;gap:6px}.screen{width:54px;height:38px;border:1px solid #71833d;display:grid;place-items:center;text-align:center;font-size:7px}.agent{width:31px;height:50px;border:1px solid #c8df72;border-radius:15px 15px 6px 6px;display:grid;place-items:center;text-align:center;font-size:7px;box-shadow:0 0 14px #c8df7222}.bet{margin-top:8px;border-top:1px solid #71833d;padding-top:7px}.stats{font-size:8px;display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:5px 0}.row{display:flex;gap:5px;margin-top:5px}.row>*{min-width:0;flex:1;padding:5px;font-size:8px}.status{margin-top:6px;font-size:7px;line-height:1.55;opacity:.72;overflow-wrap:anywhere}.trackside{border:1px solid #71833d;height:100%;min-width:0;position:relative;display:grid;grid-template-rows:62px 1fr;overflow:hidden}.racehead{border-bottom:1px solid #71833d;display:grid;grid-template-columns:repeat(10,1fr)}.lanehead{border-right:1px solid #4f5c2b;text-align:center;padding:7px 1px;font-size:7px;overflow:hidden}.lanehead:last-child{border-right:0}.lanehead b{display:block;font-size:10px;margin-bottom:3px}.track{height:100%;position:relative;display:grid;grid-template-columns:repeat(10,1fr);overflow:hidden}.lane{position:relative;border-right:1px solid #71833d}.lane:last-child{border-right:0}.car{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:16px;height:28px;border:1px solid currentColor;border-radius:4px 4px 2px 2px;transition:top 1.5s cubic-bezier(.18,.72,.2,1);z-index:3}.car:before{content:'';position:absolute;left:3px;right:3px;top:5px;height:7px;border:1px solid currentColor}.car:after{content:'';position:absolute;left:5px;right:5px;bottom:4px;height:4px;background:currentColor;opacity:.45}.startline{position:absolute;left:0;right:0;top:48px;border-top:2px solid #c8df72;z-index:4}.finish{position:absolute;left:0;right:0;bottom:28px;height:9px;border-top:1px solid #c8df72;border-bottom:1px solid #c8df72;background:repeating-linear-gradient(90deg,#c8df72 0 6px,transparent 6px 12px);opacity:.45}.fair{position:absolute;bottom:8px;left:8px;font-size:7px;opacity:.6}.winner{position:fixed;inset:0;background:#030402ef;z-index:50;display:none;place-items:center;text-align:center}.winner.on{display:grid}.winner h1{font-size:42px;letter-spacing:.18em}.winner button{padding:8px 20px}@media(max-width:760px){html,body{overflow:auto}.world{height:auto;grid-template-columns:1fr}.hubbox{max-width:none}.trackside{height:75vh}.top .muted{display:none}}</style></head><body><header class="top"><div class="brand">DRIFT</div><div class="muted">AUTONOMOUS RACE OPERATOR // ROBINHOOD CHAIN</div><button class="wallet" id="walletBtn">CONNECT</button></header><main class="world"><aside class="hub"><section class="hubbox"><div class="hubtitle">RACE HUB</div><div class="room"><div class="agentmsg" id="chat">DRIFT AGENT // booting race systems...</div><div class="desk"><div class="screen">RACE<br>CONTROL</div><div class="agent">DRIFT<br>AI</div><div class="screen">CHAIN<br>SETTLE</div></div></div><div class="bet"><div class="stats"><span>RACE <b id="raceId">#—</b></span><span>STATUS <b id="raceStatus">SYNC</b></span><span>POOL <b id="pool">0 ETH</b></span><span>CLOCK <b id="timer">--:--</b></span></div><div class="row"><select id="driver"></select><input id="amount" type="number" min="0.001" step="0.001" placeholder="ETH"></div><div class="row"><button id="betBtn" disabled>CONNECT TO BET</button></div><div class="status">COMMIT <span id="commit">—</span><br>SEED <span id="seed">HIDDEN</span><br>WINNER <span id="win">—</span></div></div></section></aside><section class="trackside"><div class="racehead" id="heads"></div><div class="track" id="track"><div class="startline"></div><div class="finish"></div><div class="fair">PROVABLY FAIR // COMMIT → BET → REVEAL → SETTLE</div></div></section></main><div class="winner" id="winner"><div><div class="muted">RACE SETTLED BY DRIFT AGENT</div><h1 id="winnerName">WINNER</h1><p id="winnerPool"></p><button onclick="winner.classList.remove('on')">RETURN TO HUB</button></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script><script>const CONTRACT='0x796c16af215C6f4c34d39cea9279c0aC79DF609e';const CHAIN={chainId:'0xB626',chainName:'Robinhood Chain Testnet',nativeCurrency:{name:'ETH',symbol:'ETH',decimals:18},rpcUrls:['https://robinhood-testnet.g.alchemy.com/v2/AUGVJZWHgMFRdBn7xeexx'],blockExplorerUrls:['https://explorer.testnet.chain.robinhood.com']};const ABI=['function currentRaceId() external view returns (uint256)','function getRace(uint256) external view returns (uint256,uint256,uint256,uint256,bytes32,bytes32,bool,bool,bool,uint8,uint256,uint256)','function getBetCount(uint256) external view returns (uint256)','function timeUntilBettingEnds(uint256) external view returns (uint256)','function placeBet(uint256,uint8) external payable'];const D=['VIPER','PHANTOM','BLAZE','NEON','STORM','SHADOW','TITAN','RAPTOR','SURGE','FROST'];let provider,signer,contract,rid=0,lastWinner=null;const $=id=>document.getElementById(id);function build(){$('heads').innerHTML=D.map((n,i)=>`<div class="lanehead"><b>${i+1}</b>${n}</div>`).join('');$('driver').innerHTML=D.map((n,i)=>`<option value="${i}">${i+1} // ${n}</option>`).join('');for(let i=0;i<10;i++){let l=document.createElement('div');l.className='lane';l.innerHTML=`<div class="car" id="car${i}"></div>`;$('track').appendChild(l)}}build();const chatter=['scanning the grid.','opening the books.','commit locked on-chain.','humans are choosing their machines.','no favorites. only entropy.','bet window is live.','locking the grid.','seed stays with me until reveal.','settlement is automatic.','another race. another proof.'];setInterval(()=>{$('chat').textContent='DRIFT AGENT // '+chatter[Math.floor(Math.random()*chatter.length)]},4200);async function connect(){if(!window.ethereum)return alert('Install MetaMask');await ethereum.request({method:'eth_requestAccounts'});try{await ethereum.request({method:'wallet_switchEthereumChain',params:[{chainId:CHAIN.chainId}]})}catch(e){if(e.code===4902)await ethereum.request({method:'wallet_addEthereumChain',params:[CHAIN]})}provider=new ethers.BrowserProvider(window.ethereum);signer=await provider.getSigner();contract=new ethers.Contract(CONTRACT,ABI,signer);let a=await signer.getAddress();$('walletBtn').textContent=a.slice(0,6)+'…'+a.slice(-4);$('betBtn').disabled=false;$('betBtn').textContent='PLACE BET';poll()}$('walletBtn').onclick=connect;async function readContract(){if(contract)return contract;let p=new ethers.JsonRpcProvider(CHAIN.rpcUrls[0]);return new ethers.Contract(CONTRACT,ABI,p)}async function poll(){try{let c=await readContract(),cid=Number(await c.currentRaceId());if(!cid)return;rid=cid-1;let r=await c.getRace(rid),tl=Number(await c.timeUntilBettingEnds(rid)),pool=Number(ethers.formatEther(r[10]));$('raceId').textContent='#'+rid;$('pool').textContent=pool.toFixed(4)+' ETH';$('timer').textContent=String(Math.floor(tl/60)).padStart(2,'0')+':'+String(tl%60).padStart(2,'0');$('raceStatus').textContent=r[8]?'SETTLED':r[7]?'RUNNING':r[6]?'BETTING':'PENDING';let z='0x'+'0'.repeat(64);$('commit').textContent=r[4]!==z?r[4].slice(0,12)+'…':'—';$('seed').textContent=r[5]!==z?r[5].slice(0,12)+'…':'HIDDEN';$('win').textContent=r[7]?D[Number(r[9])]:'—';cars(r);if(r[8]&&r[7]&&Number(r[9])!==lastWinner){lastWinner=Number(r[9]);$('winnerName').textContent=D[lastWinner];$('winnerPool').textContent='POOL '+pool.toFixed(4)+' ETH';$('winner').classList.add('on')}}catch(e){console.error(e)}}function cars(r){const t=$('track');const max=Math.max(80,t.clientHeight-72);for(let i=0;i<10;i++){let c=$('car'+i),top=14;if(r[7]||r[8])top=i===Number(r[9])?max:70+Math.random()*Math.max(40,max-130);else if(r[6])top=45+Math.random()*Math.max(40,max*.55);c.style.top=Math.min(top,max)+'px'}}$('betBtn').onclick=async()=>{if(!signer)return connect();let amt=$('amount').value;if(!amt||Number(amt)<=0)return alert('Enter ETH amount');let b=$('betBtn');b.disabled=true;b.textContent='SUBMITTING…';try{let tx=await contract.placeBet(rid,Number($('driver').value),{value:ethers.parseEther(amt)});b.textContent='CONFIRMING…';await tx.wait();b.textContent='BET PLACED';setTimeout(()=>{b.disabled=false;b.textContent='PLACE BET'},2200)}catch(e){b.disabled=false;b.textContent='PLACE BET';alert(e.reason||e.shortMessage||e.message)}};poll();setInterval(poll,2200)</script></body></html>
