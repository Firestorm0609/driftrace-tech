<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>DRIFT — AI Race Hub</title><meta name="theme-color" content="#000000"><style>:root{--neon:#ccff00;--line:#789600;--dim:#425300;--bg:#000000}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--neon);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}button,input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line)}button{cursor:pointer}.top{height:28px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 6px;gap:6px}.brand{font-weight:900;letter-spacing:.16em;font-size:10px}.muted{opacity:.55;font-size:6px}.wallet{margin-left:auto;padding:3px 6px;font-size:6px}.world{width:100vw;height:calc(100dvh - 28px);display:grid;grid-template-columns:minmax(118px,20vw) minmax(0,1fr);gap:4px;padding:4px}.hub{min-width:0;display:flex;flex-direction:column;gap:5px}.hubbox{width:100%;border:1px solid var(--line);padding:4px}.hubtitle{border:1px solid var(--line);padding:4px;text-align:center;font-size:12px;font-weight:900;letter-spacing:.08em}.room{border:1px solid var(--line);margin-top:4px;padding:4px;height:92px}.agentmsg{height:20px;border-bottom:1px dashed var(--dim);font-size:5.5px;overflow:hidden}.desk{height:62px;display:flex;align-items:center;justify-content:center;gap:3px}.screen{width:31px;height:25px;border:1px solid var(--line);display:grid;place-items:center;text-align:center;font-size:4.5px}.agent{width:20px;height:34px;border:1px solid var(--neon);border-radius:10px 10px 4px 4px;display:grid;place-items:center;text-align:center;font-size:4.5px}.bet{margin-top:4px;border-top:1px solid var(--line);padding-top:4px}.stats{font-size:5px;display:grid;grid-template-columns:1fr 1fr;gap:2px;margin:3px 0}.row{display:flex;gap:2px;margin-top:3px}.row>*{min-width:0;flex:1;padding:3px 2px;font-size:5px}.status{margin-top:4px;font-size:4.5px;line-height:1.35;opacity:.72;overflow-wrap:anywhere}.rooms{display:grid;grid-template-columns:1fr 1fr;gap:4px;align-content:start}.race-room{position:relative;height:55px;border:1px solid var(--line);background:var(--bg);padding:5px;text-align:left;overflow:hidden}.race-room:before{content:'';position:absolute;inset:4px;border:1px solid var(--dim);pointer-events:none}.race-room:hover,.race-room.active{background:#ccff000d;border-color:var(--neon)}.race-room.active:after{content:'LIVE';position:absolute;right:7px;top:6px;font-size:4px}.tier{position:relative;z-index:1;font-size:12px;font-weight:900}.roommeta{position:absolute;z-index:1;left:6px;bottom:6px;font-size:4px;opacity:.65}.trackside{border:1px solid var(--line);height:100%;width:100%;min-width:0;display:grid;grid-template-rows:38px 1fr;overflow:hidden}.racehead{width:100%;border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(10,minmax(0,1fr))}.lanehead{min-width:0;border-right:1px solid var(--dim);text-align:center;padding:4px 0;font-size:clamp(3px,.65vw,5px);overflow:hidden;white-space:nowrap}.lanehead b{display:block;font-size:clamp(6px,1vw,8px);margin-bottom:1px}.track{width:100%;height:100%;position:relative;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));overflow:hidden}.lane{min-width:0;position:relative;border-right:1px solid var(--line)}.lane:last-child,.lanehead:last-child{border-right:0}.car{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:clamp(6px,1.15vw,11px);height:clamp(13px,2.1vw,20px);border:1px solid currentColor;border-radius:2px;transition:top 1.4s cubic-bezier(.18,.72,.2,1);z-index:3}.car:before{content:'';position:absolute;left:2px;right:2px;top:3px;height:4px;border:1px solid currentColor}.car:after{content:'';position:absolute;left:3px;right:3px;bottom:2px;height:2px;background:currentColor;opacity:.45}.startline{position:absolute;left:0;right:0;top:28px;border-top:1px solid var(--neon);z-index:4}.finish{position:absolute;left:0;right:0;bottom:16px;height:6px;border-top:1px solid var(--neon);border-bottom:1px solid var(--neon);background:repeating-linear-gradient(90deg,var(--neon) 0 3px,transparent 3px 6px);opacity:.45}.fair{position:absolute;bottom:4px;left:4px;font-size:4px;opacity:.6}.winner{position:fixed;inset:0;background:#000000f2;z-index:50;display:none;place-items:center;text-align:center}.winner.on{display:grid}.winner h1{font-size:28px}@media(max-width:600px){.top .muted{display:none}.world{grid-template-columns:106px minmax(0,1fr);gap:3px;padding:3px}.hubbox{padding:3px}.hubtitle{font-size:10px;padding:3px}.room{height:80px;padding:3px}.agentmsg{height:17px;font-size:4.5px}.desk{height:54px}.screen{width:27px;height:22px;font-size:4px}.agent{width:18px;height:30px;font-size:4px}.stats{font-size:4.3px}.row>*{font-size:4.2px;padding:2px 1px}.status{font-size:3.8px}.rooms{gap:3px}.race-room{height:44px;padding:4px}.tier{font-size:9px}.roommeta{font-size:3.3px;left:5px;bottom:5px}.trackside{grid-template-rows:32px 1fr}.lanehead{font-size:3px;padding:3px 0}.lanehead b{font-size:6px}.car{width:7px;height:14px}.car:before{left:1px;right:1px;top:2px;height:3px}.car:after{left:2px;right:2px;bottom:1px}.startline{top:23px}}</style></head><body><header class="top"><div class="brand">DRIFT</div><div class="muted">AUTONOMOUS RACE OPERATOR // ROBINHOOD CHAIN</div><button class="wallet" id="walletBtn">CONNECT</button></header><main class="world"><aside class="hub"><section class="hubbox"><div class="hubtitle">RACE HUB</div><div class="room"><div class="agentmsg" id="chat">DRIFT AGENT // booting race systems...</div><div class="desk"><div class="screen">RACE<br>CONTROL</div><div class="agent">DRIFT<br>AI</div><div class="screen">CHAIN<br>SETTLE</div></div></div><div class="bet"><div class="stats"><span>RACE <b id="raceId">#—</b></span><span>STATUS <b id="raceStatus">SYNC</b></span><span>POOL <b id="pool">0 ETH</b></span><span>CLOCK <b id="timer">--:--</b></span></div><div class="row"><select id="driver"></select><input id="amount" type="number" min="0.001" step="0.001" placeholder="ETH"></div><div class="row"><button id="betBtn" disabled>CONNECT</button></div><div class="status">COMMIT <span id="commit">—</span><br>SEED <span id="seed">HIDDEN</span><br>WINNER <span id="win">—</span></div></div></section><section class="rooms" id="rooms"><button class="race-room active" data-tier="1"><span class="tier">$1</span><span class="roommeta">ROOM 01 // OPEN</span></button><button class="race-room" data-tier="5"><span class="tier">$5</span><span class="roommeta">ROOM 02 // READY</span></button><button class="race-room" data-tier="10"><span class="tier">$10</span><span class="roommeta">ROOM 03 // READY</span></button><button class="race-room" data-tier="50"><span class="tier">$50</span><span class="roommeta">ROOM 04 // READY</span></button><button class="race-room" data-tier="100"><span class="tier">$100</span><span class="roommeta">ROOM 05 // READY</span></button><button class="race-room" data-tier="500"><span class="tier">$500</span><span class="roommeta">ROOM 06 // READY</span></button><button class="race-room" data-tier="1000"><span class="tier">$1K</span><span class="roommeta">ROOM 07 // READY</span></button></section></aside><section class="trackside"><div class="racehead" id="heads"></div><div class="track" id="track"><div class="startline"></div><div class="finish"></div><div class="fair">PROVABLY FAIR // COMMIT → BET → REVEAL → SETTLE</div></div></section></main><div class="winner" id="winner"><div><div class="muted">RACE SETTLED BY DRIFT AGENT</div><h1 id="winnerName">WINNER</h1><p id="winnerPool"></p><button onclick="winner.classList.remove('on')">RETURN TO HUB</button></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script><script>const CONTRACT='0x796c16af215C6f4c34d39cea9279c0aC79DF609e';const CHAIN={chainId:'0xB626',chainName:'Robinhood Chain Testnet',nativeCurrency:{name:'ETH',symbol:'ETH',decimals:18},rpcUrls:['https://robinhood-testnet.g.alchemy.com/v2/AUGVJZWHgMFRdBn7xeexx'],blockExplorerUrls:['https://explorer.testnet.chain.robinhood.com']};const ABI=['function currentRaceId() external view returns (uint256)','function getRace(uint256) external view returns (uint256,uint256,uint256,uint256,bytes32,bytes32,bool,bool,bool,uint8,uint256,uint256)','function getBetCount(uint256) external view returns (uint256)','function timeUntilBettingEnds(uint256) external view returns (uint256)','function placeBet(uint256,uint8) external payable'];const D=['VIPER','PHANTOM','BLAZE','NEON','STORM','SHADOW','TITAN','RAPTOR','SURGE','FROST'];let provider,signer,contract,rid=0,lastWinner=null,selectedTier=1;const $=id=>document.getElementById(id);function build(){$('heads').innerHTML=D.map((n,i)=>`<div class="lanehead"><b>${i+1}</b>${n}</div>`).join('');$('driver').innerHTML=D.map((n,i)=>`<option value="${i}">${i+1} // ${n}</option>`).join('');for(let i=0;i<10;i++){let l=document.createElement('div');l.className='lane';l.innerHTML=`<div class="car" id="car${i}"></div>`;$('track').appendChild(l)}document.querySelectorAll('.race-room').forEach(x=>x.onclick=()=>{document.querySelectorAll('.race-room').forEach(y=>y.classList.remove('active'));x.classList.add('active');selectedTier=Number(x.dataset.tier);$('chat').textContent='DRIFT AGENT // $'+selectedTier+' room selected.'})}build();const chatter=['scanning the grid.','opening the books.','commit locked on-chain.','humans are choosing their machines.','no favorites. only entropy.','bet window is live.','locking the grid.','seed stays with me until reveal.','settlement is automatic.'];setInterval(()=>{$('chat').textContent='DRIFT AGENT // '+chatter[Math.floor(Math.random()*chatter.length)]},4200);async function connect(){if(!window.ethereum)return alert('Install MetaMask');await ethereum.request({method:'eth_requestAccounts'});try{await ethereum.request({method:'wallet_switchEthereumChain',params:[{chainId:CHAIN.chainId}]})}catch(e){if(e.code===4902)await ethereum.request({method:'wallet_addEthereumChain',params:[CHAIN]})}provider=new ethers.BrowserProvider(window.ethereum);signer=await provider.getSigner();contract=new ethers.Contract(CONTRACT,ABI,signer);let a=await signer.getAddress();$('walletBtn').textContent=a.slice(0,6)+'…'+a.slice(-4);$('betBtn').disabled=false;$('betBtn').textContent='PLACE BET';poll()}$('walletBtn').onclick=connect;async function readContract(){if(contract)return contract;let p=new ethers.JsonRpcProvider(CHAIN.rpcUrls[0]);return new ethers.Contract(CONTRACT,ABI,p)}async function poll(){try{let c=await readContract(),cid=Number(await c.currentRaceId());if(!cid)return;rid=cid-1;let r=await c.getRace(rid),tl=Number(await c.timeUntilBettingEnds(rid)),pool=Number(ethers.formatEther(r[10]));$('raceId').textContent='#'+rid;$('pool').textContent=pool.toFixed(4)+' ETH';$('timer').textContent=String(Math.floor(tl/60)).padStart(2,'0')+':'+String(tl%60).padStart(2,'0');$('raceStatus').textContent=r[8]?'SETTLED':r[7]?'RUNNING':r[6]?'BETTING':'PENDING';let z='0x'+'0'.repeat(64);$('commit').textContent=r[4]!==z?r[4].slice(0,12)+'…':'—';$('seed').textContent=r[5]!==z?r[5].slice(0,12)+'…':'HIDDEN';$('win').textContent=r[7]?D[Number(r[9])]:'—';cars(r);if(r[8]&&r[7]&&Number(r[9])!==lastWinner){lastWinner=Number(r[9]);$('winnerName').textContent=D[lastWinner];$('winnerPool').textContent='POOL '+pool.toFixed(4)+' ETH';$('winner').classList.add('on')}}catch(e){console.error(e)}}function cars(r){const t=$('track'),max=Math.max(45,t.clientHeight-42);for(let i=0;i<10;i++){let c=$('car'+i),top=8;if(r[7]||r[8])top=i===Number(r[9])?max:42+Math.random()*Math.max(24,max-75);else if(r[6])top=30+Math.random()*Math.max(24,max*.55);c.style.top=Math.min(top,max)+'px'}}$('betBtn').onclick=async()=>{if(!signer)return connect();let amt=$('amount').value;if(!amt||Number(amt)<=0)return alert('Enter ETH amount');let b=$('betBtn');b.disabled=true;b.textContent='SUBMITTING…';try{let tx=await contract.placeBet(rid,Number($('driver').value),{value:ethers.parseEther(amt)});b.textContent='CONFIRMING…';await tx.wait();b.textContent='BET PLACED';setTimeout(()=>{b.disabled=false;b.textContent='PLACE BET'},2200)}catch(e){b.disabled=false;b.textContent='PLACE BET';alert(e.reason||e.shortMessage||e.message)}};poll();setInterval(poll,2200)</script></body></html>
