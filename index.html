<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DRIFT — AI Race Hub</title><meta name="theme-color" content="#030402"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#030402;color:#c8df72;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}button,input,select{font:inherit;color:inherit;background:#030402;border:1px solid #71833d}button{cursor:pointer}button:hover{background:#c8df72;color:#030402}body{overflow-x:hidden}.top{height:42px;border-bottom:1px solid #71833d;display:flex;align-items:center;padding:0 18px;gap:16px;position:fixed;inset:0 0 auto 0;background:#030402;z-index:20}.brand{font-weight:900;letter-spacing:.22em}.muted{opacity:.55}.wallet{margin-left:auto;padding:6px 12px}.world{padding-top:42px;display:grid;grid-template-columns:32vw 68vw;min-height:100vh}.hub{padding:18px 20px;position:sticky;top:42px;height:calc(100vh - 42px);display:flex;align-items:flex-start;justify-content:center}.hubbox{width:min(360px,100%);border:1px solid #71833d;padding:12px}.hubtitle{border:1px solid #71833d;padding:12px;text-align:center;font-size:28px;font-weight:900;letter-spacing:.14em}.room{border:1px solid #71833d;margin-top:14px;padding:12px;min-height:220px;position:relative}.agentmsg{min-height:38px;border-bottom:1px dashed #4f5c2b;padding-bottom:8px;font-size:12px}.desk{height:118px;display:flex;align-items:end;justify-content:center;gap:8px}.screen{width:68px;height:48px;border:1px solid #71833d;display:grid;place-items:center;font-size:9px}.agent{width:38px;height:64px;border:1px solid #c8df72;border-radius:18px 18px 8px 8px;display:grid;place-items:center;font-size:9px;box-shadow:0 0 18px #c8df7222}.bet{margin-top:14px;border-top:1px solid #71833d;padding-top:12px}.row{display:flex;gap:7px;margin-top:7px}.row>*{min-width:0;flex:1;padding:7px}.stats{font-size:11px;display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}.status{margin-top:10px;font-size:10px;line-height:1.7;opacity:.72}.trackside{border-left:1px solid #71833d;min-height:1500px;position:relative}.racehead{height:96px;border-bottom:1px solid #71833d;position:sticky;top:42px;background:#030402;z-index:10;display:grid;grid-template-columns:repeat(10,1fr)}.lanehead{border-right:1px solid #4f5c2b;text-align:center;padding:10px 2px;font-size:9px}.lanehead b{display:block;font-size:13px;margin-bottom:4px}.track{height:1400px;position:relative;display:grid;grid-template-columns:repeat(10,1fr);overflow:hidden}.lane{position:relative;border-right:1px solid #71833d}.lane:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 0 96%,#c8df720b)}.car{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:22px;height:38px;border:1px solid currentColor;border-radius:5px 5px 3px 3px;transition:top 1.7s cubic-bezier(.18,.72,.2,1);z-index:3}.car:before{content:'';position:absolute;left:4px;right:4px;top:7px;height:9px;border:1px solid currentColor}.car:after{content:'';position:absolute;left:7px;right:7px;bottom:5px;height:5px;background:currentColor;opacity:.45}.startline{position:absolute;left:0;right:0;top:68px;border-top:2px solid #c8df72;z-index:4}.finish{position:absolute;left:0;right:0;bottom:42px;height:12px;border-top:1px solid #c8df72;border-bottom:1px solid #c8df72;background:repeating-linear-gradient(90deg,#c8df72 0 8px,transparent 8px 16px);opacity:.45}.fair{position:absolute;bottom:10px;left:12px;font-size:9px;opacity:.6}.winner{position:fixed;inset:0;background:#030402eF;z-index:50;display:none;place-items:center;text-align:center}.winner.on{display:grid}.winner h1{font-size:48px;letter-spacing:.18em}.winner button{padding:10px 24px}.mobilemsg{display:none}@media(max-width:800px){.world{grid-template-columns:1fr}.hub{position:relative;top:0;height:auto}.trackside{border-left:0;border-top:1px solid #71833d}.racehead{top:42px}.track{height:1100px}.hubtitle{font-size:22px}}</style></head><body><header class="top"><div class="brand">DRIFT</div><div class="muted">AUTONOMOUS RACE OPERATOR // ROBINHOOD CHAIN</div><button class="wallet" id="walletBtn">CONNECT</button></header><main class="world"><aside class="hub"><section class="hubbox"><div class="hubtitle">RACE HUB</div><div class="room"><div class="agentmsg" id="chat">DRIFT AGENT // booting race systems...</div><div class="desk"><div class="screen">RACE<br>CONTROL</div><div class="agent">DRIFT<br>AI</div><div class="screen">CHAIN<br>SETTLE</div></div></div><div class="bet"><div class="stats"><span>RACE <b id="raceId">#—</b></span><span>STATUS <b id="raceStatus">SYNC</b></span><span>POOL <b id="pool">0 ETH</b></span><span>CLOCK <b id="timer">--:--</b></span></div><div class="row"><select id="driver"></select><input id="amount" type="number" min="0.001" step="0.001" placeholder="ETH"></div><div class="row"><button id="betBtn" disabled>CONNECT TO BET</button></div><div class="status">COMMIT <span id="commit">—</span><br>SEED <span id="seed">HIDDEN</span><br>WINNER <span id="win">—</span></div></div></section></aside><section class="trackside"><div class="racehead" id="heads"></div><div class="track" id="track"><div class="startline"></div><div class="finish"></div><div class="fair">PROVABLY FAIR // COMMIT → BET → REVEAL → SETTLE</div></div></section></main><div class="winner" id="winner"><div><div class="muted">RACE SETTLED BY DRIFT AGENT</div><h1 id="winnerName">WINNER</h1><p id="winnerPool"></p><button onclick="winner.classList.remove('on')">RETURN TO HUB</button></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script><script>const CONTRACT='0x796c16af215C6f4c34d39cea9279c0aC79DF609e';const CHAIN={chainId:'0xB626',chainName:'Robinhood Chain Testnet',nativeCurrency:{name:'ETH',symbol:'ETH',decimals:18},rpcUrls:['https://robinhood-testnet.g.alchemy.com/v2/AUGVJZWHgMFRdBn7xeexx'],blockExplorerUrls:['https://explorer.testnet.chain.robinhood.com']};const ABI=['function currentRaceId() external view returns (uint256)','function getRace(uint256) external view returns (uint256,uint256,uint256,uint256,bytes32,bytes32,bool,bool,bool,uint8,uint256,uint256)','function getBetCount(uint256) external view returns (uint256)','function timeUntilBettingEnds(uint256) external view returns (uint256)','function placeBet(uint256,uint8) external payable'];const D=['VIPER','PHANTOM','BLAZE','NEON','STORM','SHADOW','TITAN','RAPTOR','SURGE','FROST'];let provider,signer,contract,rid=0,lastWinner=null;const $=id=>document.getElementById(id);function build(){ $('heads').innerHTML=D.map((n,i)=>`<div class="lanehead"><b>${i+1}</b>${n}</div>`).join('');$('driver').innerHTML=D.map((n,i)=>`<option value="${i}">${i+1} // ${n}</option>`).join('');for(let i=0;i<10;i++){let l=document.createElement('div');l.className='lane';l.innerHTML=`<div class="car" id="car${i}"></div>`;$('track').appendChild(l)}}build();const chatter=['scanning the grid.','opening the books.','commit locked on-chain.','humans are choosing their machines.','no favorites. only entropy.','bet window is live.','locking the grid.','seed stays with me until reveal.','settlement is automatic.','another race. another proof.'];setInterval(()=>{$('chat').textContent='DRIFT AGENT // '+chatter[Math.floor(Math.random()*chatter.length)]},4200);async function connect(){if(!window.ethereum)return alert('Install MetaMask');await ethereum.request({method:'eth_requestAccounts'});try{await ethereum.request({method:'wallet_switchEthereumChain',params:[{chainId:CHAIN.chainId}]})}catch(e){if(e.code===4902)await ethereum.request({method:'wallet_addEthereumChain',params:[CHAIN]})}provider=new ethers.BrowserProvider(window.ethereum);signer=await provider.getSigner();contract=new ethers.Contract(CONTRACT,ABI,signer);let a=await signer.getAddress();$('walletBtn').textContent=a.slice(0,6)+'…'+a.slice(-4);$('betBtn').disabled=false;$('betBtn').textContent='PLACE BET';poll()}$('walletBtn').onclick=connect;async function readContract(){if(contract)return contract;let p=new ethers.JsonRpcProvider(CHAIN.rpcUrls[0]);return new ethers.Contract(CONTRACT,ABI,p)}async function poll(){try{let c=await readContract(),cid=Number(await c.currentRaceId());if(!cid)return;rid=cid-1;let r=await c.getRace(rid),tl=Number(await c.timeUntilBettingEnds(rid)),pool=Number(ethers.formatEther(r[10]));$('raceId').textContent='#'+rid;$('pool').textContent=pool.toFixed(4)+' ETH';$('timer').textContent=String(Math.floor(tl/60)).padStart(2,'0')+':'+String(tl%60).padStart(2,'0');$('raceStatus').textContent=r[8]?'SETTLED':r[7]?'RUNNING':r[6]?'BETTING':'PENDING';let z='0x'+'0'.repeat(64);$('commit').textContent=r[4]!==z?r[4].slice(0,12)+'…':'—';$('seed').textContent=r[5]!==z?r[5].slice(0,12)+'…':'HIDDEN';$('win').textContent=r[7]?D[Number(r[9])]:'—';cars(r);if(r[8]&&r[7]&&Number(r[9])!==lastWinner){lastWinner=Number(r[9]);$('winnerName').textContent=D[lastWinner];$('winnerPool').textContent='POOL '+pool.toFixed(4)+' ETH';$('winner').classList.add('on')}}catch(e){console.error(e)}}function cars(r){for(let i=0;i<10;i++){let c=$('car'+i),top=18;if(r[7]||r[8])top=i===Number(r[9])?1280:250+Math.random()*900;else if(r[6])top=50+Math.random()*650;c.style.top=top+'px'}}$('betBtn').onclick=async()=>{if(!signer)return connect();let amt=$('amount').value;if(!amt||Number(amt)<=0)return alert('Enter ETH amount');let b=$('betBtn');b.disabled=true;b.textContent='SUBMITTING…';try{let tx=await contract.placeBet(rid,Number($('driver').value),{value:ethers.parseEther(amt)});b.textContent='CONFIRMING…';await tx.wait();b.textContent='BET PLACED';setTimeout(()=>{b.disabled=false;b.textContent='PLACE BET'},2200)}catch(e){b.disabled=false;b.textContent='PLACE BET';alert(e.reason||e.shortMessage||e.message)}};poll();setInterval(poll,2200)</script></body></html>
